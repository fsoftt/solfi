// Applied from build.gradle.kts only when an Android SDK is present.
android {
    namespace = "com.solfi.app"
    compileSdk = 36
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "com.solfi.app"
        minSdk = 24
        targetSdk = 36
        versionCode = (System.getenv("SOLFI_VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("SOLFI_VERSION_NAME") ?: "1.0.0"
    }
    packaging {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
    }
    signingConfigs {
        debug {
            // Debug-only key, the same one PiccoloReader uses for debug builds. Release builds are not signed with it.
            storeFile rootProject.file("keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    // Release signing: only from env vars or Gradle properties. Never commit the key.
    def releaseProp = { String n -> System.getenv(n) ?: (project.findProperty(n)?.toString()) }
    def relFile = releaseProp("SOLFI_KEYSTORE_FILE")
    def relStorePass = releaseProp("SOLFI_KEYSTORE_PASSWORD")
    def relAlias = releaseProp("SOLFI_KEY_ALIAS")
    def relKeyPass = releaseProp("SOLFI_KEY_PASSWORD")
    def hasReleaseSigning = [relFile, relStorePass, relAlias, relKeyPass].every { it }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(relFile)
                storePassword relStorePass
                keyAlias relAlias
                keyPassword relKeyPass
            }
        }
    } else {
        logger.warn("WARNING: SOLFI_KEYSTORE_FILE/SOLFI_KEYSTORE_PASSWORD/SOLFI_KEY_ALIAS/SOLFI_KEY_PASSWORD not all set; release build will be UNSIGNED.")
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false // R8 intentionally off for now
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.manifest.srcFile "src/androidMain/AndroidManifest.xml"
        main.res.srcDirs = ["src/androidMain/res"]
    }
}
