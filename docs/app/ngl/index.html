<!doctype html>
<html lang="es">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solfi · App</title>
<meta name="description" content="Solfi en el navegador: aprende música desde cero con lecciones, solfeos, piano y progreso.">
<meta name="theme-color" content="#6C5CE7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfi">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FAF9FF; overscroll-behavior: none; }
  #solfi { position: fixed; inset: 0; }
  #splash {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #FAF9FF; color: #5A5670; font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .35s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img { width: 88px; height: 88px; animation: bob 1.4s ease-in-out infinite; }
  #splash .bar { width: 140px; height: 6px; border-radius: 3px; background: #E7E3FF; overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #6C5CE7; animation: slide 1.1s ease-in-out infinite; }
  #splash .err { display: none; max-width: 320px; text-align: center; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-color-scheme: dark) {
    html, body, #splash { background: #12101C; color: #C1BDD8; }
    #splash .bar { background: #3A2FA8; }
    #splash .bar i { background: #B4A9FF; }
  }
</style>
</head>
<body>
<div id="solfi"></div>
<div id="splash" role="status" aria-live="polite">
  <img src="favicon.svg" alt="">
  <div class="bar"><i></i></div>
  <div class="err" id="splash-err">Tu navegador no es compatible con Solfi web. Prueba con una versión reciente de Chrome, Edge, Firefox o Safari.</div>
</div>
<script>
  // Kotlin/Wasm needs WebAssembly GC (Chrome/Edge 119+, Firefox 120+, Safari 18.2+).
  (function () {
    var ok = false;
    try {
      ok = typeof WebAssembly === 'object' && WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0]));
    } catch (e) {}
    if (!ok) {
      document.querySelector('#splash .bar').style.display = 'none';
      document.getElementById('splash-err').style.display = 'block';
      return;
    }
    var s = document.createElement('script');
    s.src = 'composeApp.js';
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
