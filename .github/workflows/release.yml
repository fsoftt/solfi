name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (draft until the app is first published)
        type: choice
        options: [draft, completed]
        default: draft
      upload_to_play:
        description: Upload the AAB to Google Play (disable for the very first release)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}
      STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.status || 'draft' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Desktop tests
        run: ./gradlew :composeApp:desktopTest

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SOLFI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SOLFI_RELEASE_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SOLFI_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          echo "SOLFI_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "SOLFI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "SOLFI_VERSION_NAME=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build signed AAB and APK
        env:
          SOLFI_KEYSTORE_PASSWORD: ${{ secrets.SOLFI_KEYSTORE_PASSWORD }}
          SOLFI_KEY_ALIAS: ${{ secrets.SOLFI_KEY_ALIAS }}
          SOLFI_KEY_PASSWORD: ${{ secrets.SOLFI_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(ls composeApp/build/outputs/apk/release/*.apk | head -n1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          case "$APK" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          OUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$OUT"
          DEBUG_SHA=$(keytool -list -keystore keystore/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i 'fingerprint' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f' || true)
          SIGNER_SHA=$(echo "$OUT" | grep -i 'certificate SHA-256 digest' | head -n1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$SIGNER_SHA" ]; then echo "::error::No signer certificate found"; exit 1; fi
          if [ -n "$DEBUG_SHA" ] && [ "$SIGNER_SHA" = "$DEBUG_SHA" ]; then
            echo "::error::APK is signed with the debug certificate"; exit 1
          fi
          if echo "$OUT" | grep -qi 'Android Debug'; then
            echo "::error::APK is signed with the debug certificate"; exit 1
          fi

      - name: Locate bundle and mapping
        run: |
          AAB=$(ls composeApp/build/outputs/bundle/release/*.aab | head -n1)
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          MAP=composeApp/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then echo "MAPPING=$MAP" >> "$GITHUB_ENV"; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: solfi-release-${{ env.SOLFI_VERSION_NAME }}
          path: |
            ${{ env.APK }}
            ${{ env.AAB }}
          if-no-files-found: error

      - name: Check Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_TO_PLAY: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_play }}
        run: |
          if [ "$UPLOAD_TO_PLAY" != "true" ]; then
            echo "::notice::upload_to_play=false: skipping Google Play upload"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PLAY_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is empty: skipping Google Play upload"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.solfi.app
          releaseFiles: ${{ env.AAB }}
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          mappingFile: ${{ env.MAPPING }}

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2.2.2
        with:
          generate_release_notes: true
          files: |
            ${{ env.APK }}
            ${{ env.AAB }}

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
