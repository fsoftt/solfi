name: Deploy Pages

# Publishes docs/ (landing page + web app in docs/app) to GitHub Pages.
# Settings → Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  # docs/app is committed by the "Web app" workflow with GITHUB_TOKEN, which does not trigger push events
  workflow_run:
    workflows: ["Web app"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
