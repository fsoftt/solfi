name: Tests

on:
  pull_request:
  push:
    branches: ['ccr-*']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests (common + desktop)
        run: ./gradlew :composeApp:desktopTest -Dsolfi.noAndroid=true --console=plain
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-report
          path: composeApp/build/reports/tests/
