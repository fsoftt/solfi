name: Web app

# Builds the browser version (Kotlin/Wasm) and commits it to docs/app/,
# which GitHub Pages serves at https://fsoftt.github.io/solfi/app/
on:
  push:
    branches: [main, 'ccr-*']
    paths:
      - 'composeApp/src/commonMain/**'
      - 'composeApp/src/wasmJsMain/**'
      - 'composeApp/build.gradle.kts'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app into docs/app
        run: ./gradlew :composeApp:publishWebApp -Dsolfi.noAndroid=true --console=plain

      - name: Commit docs/app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/app
          if git diff --cached --quiet; then
            echo "docs/app is up to date"
            exit 0
          fi
          git commit -m "chore(web): rebuild docs/app from ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
